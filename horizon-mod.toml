id = "gmut"
name = "Gravitational Modulating Additional Unit"
version = "0.2.1"
description = """A port of Gravitational Modulating Additional Unit for Horizon: the unit item and the
vertical-speed setting it keeps. The item stores one of five steps (off, low, medium, high and ultra,
1.0x to 3.0x) in its own per-stack gmut:vertical_speed component; a right click (back while sneaking)
and /gmut mode|next|prev set and cycle it, and /gmut info reports the placement, the stored step and
the MekaSuit gate. The stored step is a setting only: this port does not change the player's velocity,
gravity, flight, field of view or sound, and flight is never granted. Those effects need a worn
MekaSuit carrying a working gravitational modulating unit, and Mekanism is not ported at this pin, so
the gate is always needs_gravitational_modulating_unit. The jar's recipe and its advancement are not
carried: their Mekanism ingredients do not exist here, so the item is give/creative only."""
authors = ["gisellevonbingen", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: the item, its component type and its commands
# are server behaviour, its tooltip is the client's, and an integrated server belongs to the
# client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); this mod registers an item, its creative tab, and one NBT component type.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
